<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoSQL Demo: Redis & MongoDB</title>
    <style>
        :root { --primary: #009688; --bg: #eceff1; --text: #263238; --card-bg: #fff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; }
        .view { display: none; background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .view.active { display: block; }
        h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #cfd8dc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 5px; }
        button:hover { background-color: #00796b; }
        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eceff1; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #37474f; color: white; padding: 10px; border-radius: 4px; }
        .nav-btn { background: #546e7a; margin: 0 5px; }
        .badge { color: white; padding: 3px 8px; border-radius: 12px; font-size: 12px; margin-left: 10px;}
        .badge.mongo { background: #4CAF50; }
        .badge.redis { background: #D32F2F; }
        .history-card { border: 1px solid #b0bec5; border-left: 4px solid var(--primary); margin-bottom: 10px; padding: 10px; border-radius: 4px; }
        .meta-data { font-size: 12px; color: #78909c; display: block; margin-top: 5px;}
        .loading { font-style: italic; color: #666; padding: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="login-view" class="view active">
        <h2>System Login <span class="badge mongo">MongoDB</span></h2>
        <input type="text" id="username" placeholder="Username (e.g., dat_nguyen)" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="handleLogin()">Sign In</button>
    </div>

    <div id="main-nav" class="nav-bar" style="display: none;">
        <span>User: <b id="display-user"></b></span>
        <div>
            <button class="nav-btn" onclick="renderRestaurants(); showView('restaurant-view')">Restaurants</button>
            <button class="nav-btn" onclick="renderHistory(); showView('history-view')">Payment History</button>
            <button class="nav-btn" style="background: #d32f2f;" onclick="logout()">Logout</button>
        </div>
    </div>

    <div id="restaurant-view" class="view">
        <h2>Select a Restaurant <span class="badge redis">Redis Cache</span></h2>
        <div id="restaurant-list"></div>
    </div>

    <div id="menu-view" class="view">
        <h2 id="menu-title">Menu <span class="badge redis">Redis Cache</span></h2>
        <div id="menu-list"></div>
    </div>

    <div id="history-view" class="view">
        <h2>Your Payment History <span class="badge redis" style="background:#FF6F00">Apache Cassandra</span></h2>
        <div id="history-list"></div>
    </div>

</div>

<script>
    const API_BASE_URL = 'http://localhost:3000/api';
    let currentUser = null;

    // --- UI Navigation ---
    function showView(viewId) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
        if (currentUser) document.getElementById('main-nav').style.display = 'flex';
    }

    // --- AUTHENTICATION (MongoDB) ---
    async function handleLogin() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        if (!user || !pass) return alert("Please enter a username and password.");

        try {
            const response = await fetch(`${API_BASE_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Login failed");
            
            currentUser = data.user.username;
            document.getElementById('display-user').innerText = currentUser;
            renderRestaurants();
            showView('restaurant-view');
        } catch (error) {
            alert(`Error: ${error.message}`);
        }
    }

    function logout() {
        currentUser = null;
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.getElementById('main-nav').style.display = 'none';
        showView('login-view');
    }

    // --- CATALOG (Redis) ---
    async function renderRestaurants() {
        const container = document.getElementById('restaurant-list');
        container.innerHTML = "<div class='loading'>Fetching restaurants from Redis...</div>";

        try {
            const response = await fetch(`${API_BASE_URL}/restaurants`);
            const restaurants = await response.json();

            if (!response.ok) throw new Error("Failed to fetch from backend");

            container.innerHTML = restaurants.map(r => `
                <div class="list-item">
                    <div><strong>${r.name}</strong><br><small>${r.type}</small></div>
                    <button onclick="openMenu('${r.id}', '${r.name}')">View Menu</button>
                </div>
            `).join('');
        } catch (error) {
            container.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
    }

    async function openMenu(restId, restName) {
        document.getElementById('menu-title').innerHTML = `Menu: ${restName} <span class="badge redis">Redis Cache</span>`;
        showView('menu-view');
        
        const container = document.getElementById('menu-list');
        container.innerHTML = "<div class='loading'>Fetching menu from Redis...</div>";

        try {
            const response = await fetch(`${API_BASE_URL}/restaurants/${restId}/menu`);
            const menu = await response.json();

            if (!response.ok) throw new Error("Failed to fetch menu");

            container.innerHTML = menu.map(item => `
                <div class="list-item">
                    <div><strong>${item.name}</strong><br>₫${item.price.toLocaleString()}</div>
                    <button onclick="simulatePayment('${restId}', '${restName}', '${item.name}', ${item.price})">Pay Now (Demo)</button>
                </div>
            `).join('');
        } catch (error) {
            container.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
    }

    // --- TRANSACTIONS (MongoDB) ---
    async function simulatePayment(restId, restName, itemName, price) {
        const transactionRecord = {
            transactionId: 'TXN-' + Math.random().toString(36).substr(2, 9).toUpperCase(),
            user: currentUser,
            restaurant: restName, 
            item: itemName,
            amount: price,
            currency: 'VND',
            timestamp: new Date().toISOString(),
            status: 'SUCCESS'
        };

        try {
            const response = await fetch(`${API_BASE_URL}/payments/add`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(transactionRecord)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || "Failed to process payment");

            alert(`Payment successful! Transaction ID: ${transactionRecord.transactionId}`);
        } catch (error) {
            alert(`Error: ${error.message}`);
        }
    }

    async function renderHistory() {
        const container = document.getElementById('history-list');
        container.innerHTML = "<div class='loading'>Fetching history from Apache Cassandra...</div>";

        try {
            const response = await fetch(`${API_BASE_URL}/payments/history/${currentUser}`);
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || "Failed to fetch history");

            const history = result.data; 

            if (!history || history.length === 0) {
                container.innerHTML = "<p>No payments found.</p>";
                return;
            }

            container.innerHTML = history.map(record => {
                const dateStr = new Date(record.timestamp).toLocaleString();
                return `
                    <div class="history-card">
                        <div style="display: flex; justify-content: space-between;">
                            <strong>₫${record.amount.toLocaleString()} - ${record.item}</strong>
                            <span style="color: green; font-weight: bold;">${record.status}</span>
                        </div>
                        <span class="meta-data">@ ${record.restaurant}</span>
                        <span class="meta-data">TXN: ${record.transactionId} | Date: ${dateStr}</span>
                    </div>
                `;
            }).join('');
        } catch (error) {
            container.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
        }
    }
</script>
</body>
</html>
